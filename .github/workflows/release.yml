name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / PHP ${{ matrix.php }} ${{ matrix.ts }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        ts: [nts, zts]
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/test
        with:
          php: ${{ matrix.php }}
          ts: ${{ matrix.ts }}
          upload: "true"

  publish:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum simsimd-*.tar.gz php_simsimd-*.zip | tee SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          append_body: true
          body: |
            `pie install switon/simsimd` uses the `php_simsimd-*.zip` assets. A manual download is `simsimd-<version>-php<php>-<nts|zts>-<linux|macos|windows>-<x64|arm64>.tar.gz`. Unpack it. The only file inside is `simsimd.so` on Linux and macOS, or `php_simsimd.dll` on Windows. `php --ri simsimd` reports the version.

            ```ini
            extension=/path/simsimd.so
            ```

            On Windows the line is `extension=C:/path/php_simsimd.dll`. `extension=simsimd` loads `simsimd.so` on Linux and macOS, and `php_simsimd.dll` on Windows. Linux builds are Ubuntu 24.04 glibc. Windows builds are x64.
          files: |
            dist/simsimd-*.tar.gz
            dist/php_simsimd-*.zip
            dist/SHA256SUMS
