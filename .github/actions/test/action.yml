name: Build and test
description: Install one PHP build, compile the extension, and run make test.
inputs:
  php:
    description: PHP minor version, such as 8.4
    required: true
  ts:
    description: nts or zts
    required: true
  upload:
    description: Upload the release library when true
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install Windows build tools
      if: runner.os == 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        choco install llvm make -y --no-progress
        echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

    - name: Install PHP ${{ inputs.php }} ${{ inputs.ts }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php }}
        coverage: none
      env:
        phpts: ${{ inputs.ts }}

    - name: Test
      shell: bash
      env:
        EXPECTED_PHP: ${{ inputs.php }}
        EXPECTED_TS: ${{ inputs.ts }}
        UPLOAD: ${{ inputs.upload }}
      run: |
        set -euo pipefail
        ver=$(php -r 'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION;')
        ts=$(php -r 'echo PHP_ZTS ? "zts" : "nts";')
        echo "PHP $ver $ts"
        php -v
        if [ "$ver" != "$EXPECTED_PHP" ] || [ "$ts" != "$EXPECTED_TS" ]; then
          echo "expected PHP ${EXPECTED_PHP} ${EXPECTED_TS}, got ${ver} ${ts}" >&2
          exit 1
        fi
        set +e
        make test
        test_status=$?
        set -e
        echo "make test exit ${test_status}"
        if [[ "$test_status" -ne 0 ]]; then
          exit "$test_status"
        fi
        case "$(uname -s)" in
          Linux|Darwin) lib=pie/modules/simsimd.so ;;
          MINGW*|MSYS*|CYGWIN*) lib=pie/modules/php_simsimd.dll ;;
          *)
            echo "unsupported OS $(uname -s)" >&2
            exit 1
            ;;
        esac
        bash "$GITHUB_ACTION_PATH/check-linkage.sh" "$lib"
        if [ "$UPLOAD" != "true" ]; then
          exit 0
        fi
        case "$(uname -m)" in
          x86_64|amd64|AMD64) arch=x64 ;;
          aarch64|arm64) arch=arm64 ;;
          *)
            echo "unsupported CPU $(uname -m)" >&2
            exit 1
            ;;
        esac
        case "$(uname -s)" in
          Linux) platform=linux ;;
          Darwin) platform=macos ;;
          MINGW*|MSYS*|CYGWIN*) platform=windows ;;
        esac
        name=$(basename "$lib")
        rm -rf dist
        mkdir -p dist/pkg
        cp "$lib" "dist/pkg/$name"
        pkg_ver=$(sh scripts/ext-version.sh)
        # PIE matches the Packagist version, which keeps the leading v from the git tag.
        case "$pkg_ver" in
          v*) pie_ver=$pkg_ver ;;
          [0-9]*) pie_ver=v$pkg_ver ;;
          *) pie_ver=$pkg_ver ;;
        esac
        tar -C dist/pkg -czf "dist/simsimd-${pkg_ver}-php${ver}-${ts}-${platform}-${arch}.tar.gz" "$name"
        case "$arch" in
          x64) pie_arch=x86_64 ;;
          arm64) pie_arch=arm64 ;;
        esac
        case "$platform" in
          linux)
            pie_zip="dist/php_simsimd-${pie_ver}_php${ver}-${pie_arch}-linux-glibc-${ts}.zip"
            pie_member=simsimd.so
            ;;
          macos)
            pie_zip="dist/php_simsimd-${pie_ver}_php${ver}-${pie_arch}-darwin-bsdlibc-${ts}.zip"
            pie_member=simsimd.so
            ;;
          windows)
            case "$ts" in
              zts) win_ts=ts ;;
              *) win_ts=nts ;;
            esac
            case "$ver" in
              8.2|8.3) compiler=vs16 ;;
              *) compiler=vs17 ;;
            esac
            pie_member="php_simsimd-${pie_ver}-${ver}-${win_ts}-${compiler}-x86_64.dll"
            pie_zip="dist/${pie_member%.dll}.zip"
            ;;
        esac
        python3 -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1], "w", compression=zipfile.ZIP_DEFLATED).write(sys.argv[2], sys.argv[3])' \
          "$pie_zip" "dist/pkg/$name" "$pie_member"
        rm -rf dist/pkg

    - name: Upload library
      if: inputs.upload == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: simsimd-${{ inputs.php }}-${{ inputs.ts }}-${{ runner.os }}-${{ runner.arch }}
        path: dist/*
        if-no-files-found: error
